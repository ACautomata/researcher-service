# Verified from the production network; overseas defaults time out there.
use_default_settings:
  engines:
    keep_only:
      - 360search
      - sogou
      - baidu kaifa
      - bilibili
      - sogou videos
engines:
  - name: 360search
    disabled: false
  - name: sogou
    disabled: false
  - name: baidu kaifa
    disabled: false
  - name: bilibili
    disabled: false
  - name: sogou videos
    disabled: false
general:
  instance_name: "Researcher learning resources"
search:
  formats:
    - html
    - json
server:
  limiter: false
  image_proxy: false
outgoing:
  request_timeout: 4.0
  max_request_timeout: 8.0

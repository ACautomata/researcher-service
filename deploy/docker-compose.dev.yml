# deploy/docker-compose.dev.yml —— 面板 dev 栈（控制面容器化，issue #594 / ADR 0013）
#
# 与 prod（deploy/docker-compose.deploy.yml）同形态：server（TS/Express 控制面，复用 prod
# Dockerfile 构建产物）挂 docker.sock 编排面板自管容器（会话沙箱 + wiki 容器）+ redis
#（runner BullMQ 队列）。消除「dev 直跑摸不到 named volume」分叉（ADR 0012：宿主直跑时 named
# volume 物理路径在 Docker VM 内不可达，dev/prod 寻址与路径语义由此分叉）。
#
# 与 prod 的差异（仅 dev 必需项）：
#   - NODE_ENV=development（走 config.ts dev 分支：JWT_SECRET 用 dev 默认，cookie Secure 关）；
#   - server 暴露 127.0.0.1:8001:8001（frontend vite dev 在宿主跑，proxy /api → :8001；
#     prod server 不暴露，走内部 panel-net 由 frontend nginx 反代）；
#   - 本地 build（非 GHCR image）；
#   - 独立 named volume panel-dev-db（与 prod panel-db 隔离）。
#
# 用法：
#   1.（会话 run 需）LLM key（config.ts dev 缺省可起控制面/登录，发消息才需）：
#        export LLM_API_KEY=...
#   2. 起栈：docker compose -f deploy/docker-compose.dev.yml up -d --build
#   3. 前端：cd frontend && npm run dev（vite proxy /api → 127.0.0.1:8001）
#   4. 改 server 代码：docker compose -f deploy/docker-compose.dev.yml up -d --build server
#
# #858 OpenClaw 退役③：fleet 编排与 home 模板 provisioning 退役——build 的 template
# additional_context / OPENCLAW_TEMPLATE_DIR / OPENCLAW_FLEET_ROOT 随之退役（落盘根改 DATA_ROOT）。

name: panel-dev

services:
  server:
    build:
      context: ../server
      # prod Dockerfile 的构建多 context：official/plugins 兄弟目录（#788 hotfix 布局）；
      # 路径基准 = 本目录 deploy/。
      additional_contexts:
        official: ../official
        plugins: ../plugins                          # #788 插件目录（#752 R1 根级源直引入镜像）

    image: panel-server:dev
    container_name: panel-dev-server
    restart: unless-stopped
    depends_on:
      - redis      # 启动顺序：redis 先于 server（仅启动序，非就绪等待；entrypoint 落表阶段给 redis 留出窗口，同 prod）
    ports:
      # dev 特有：暴露给宿主 vite dev proxy（prod server 不暴露）。仅 loopback。
      - "127.0.0.1:8001:8001"
    environment:
      # 与 prod 逐一对齐，仅 NODE_ENV 不同。config.ts 唯一 env 读取处（server/src/config.ts）。
      NODE_ENV: development
      PORT: "8001"
      REDIS_URL: redis://redis:6379/0
      # SQLite 持久化：dev 独立 named volume 挂载点（与 prod panel-db 隔离）。
      DATABASE_URL: file:/app/db/db.sqlite3
      # 控制面落盘根（容器内路径，无宿主挂载；#858 前身 OPENCLAW_FLEET_ROOT）：附件上传临时区。
      DATA_ROOT: /data
      # 敏感项：LLM_API_KEY / LLM_CREDENTIAL_SECRET 显式列（shell 可选注入，空串安全 =
      # config.ts dev 缺省）；JWT_SECRET 不列，走 config.ts dev 默认。LLM_PRESET / LLM_MODEL
      #（#881 平台默认端点预设与单模型覆盖）可选，不列走缺省 minimax/预设默认模型。
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_CREDENTIAL_SECRET: ${LLM_CREDENTIAL_SECRET:-}
      # AutoFigure（#792 插件化收口起回归，同 prod 三必填键）：shell 可选注入，空串安全 =
      # assertPluginEnv dev 警告不阻断（dev 缺键时 figure 工具调用期明确报错）。可选键
      # AUTOFIGURE_IMAGE_BASE_URL 同机制；AUTOFIGURE_SVG_MODEL 为废弃兼容 pin，
      # 设值告警，建议在模型配置页改用插件 LLM 指派。
      AUTOFIGURE_IMAGE_MODEL: ${AUTOFIGURE_IMAGE_MODEL:-}
      AUTOFIGURE_IMAGE_API_KEY: ${AUTOFIGURE_IMAGE_API_KEY:-}
      FAL_KEY: ${FAL_KEY:-}
    volumes:
      # 唯一宿主数据挂载（ADR 0013 豁免）：控制面经 docker.sock 编排面板自管容器。
      - /var/run/docker.sock:/var/run/docker.sock
      # SQLite 持久化：DATABASE_URL 指向本 named volume 挂载点 /app/db/db.sqlite3。
      - panel-dev-db:/app/db
    networks:
      - panel-dev-net

  redis:
    image: redis:7-alpine
    container_name: panel-dev-redis
    restart: unless-stopped
    # BullMQ 队列后端；仅内部网络，不对宿主暴露（同 prod）。
    networks:
      - panel-dev-net


networks:
  panel-dev-net:
    driver: bridge

volumes:
  panel-dev-db:

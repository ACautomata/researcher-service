# deploy/docker-compose.deploy.yml —— 面板生产栈（BaoTa 边缘 TLS 之后的应用层）
#
# 由 CD（.github/workflows/cd.yml）scp 到宿主 /www/panel/ 并经 `docker compose ... up -d` 启动。
# 三服务：frontend（唯一对宿主暴露，loopback 18080 供 BaoTa 反代）/ server（内部，TS/Express 控制面，
# docker.sock 编排面板自管容器（会话沙箱 + wiki 容器）+ SQLite 卷）/ redis（内部，BullMQ 队列）。
# 宿主数据挂载唯一豁免：/var/run/docker.sock（ADR 0013，spec §5.4 已接受等价 root）。
# （#341 M9：backend 服务退役 Django，切换为 server 服务跑 Express 控制面。
#   #859 OpenClaw 退役④：OpenClaw 编排内核与 GATEWAY_TOKEN 凭证链整链退役。）
#
# 运行时敏感值（JWT_SECRET / LLM_API_KEY /
# AUTOFIGURE_IMAGE_API_KEY / FAL_KEY）经同目录 .env（env_file）注入，不落盘进 git；
# 非敏感固定项（REDIS_URL/DATA_ROOT/端口/AUTOFIGURE_IMAGE_MODEL）直接写在本文件
# 或 .env。AutoFigure 键清单见 server env 段注释（#792 起）。
#
# 用法（CD 已自动化；手工排障时参考）：
#   docker compose -f docker-compose.deploy.yml --env-file .env pull
#   docker compose -f docker-compose.deploy.yml --env-file .env up -d --remove-orphans

name: panel

services:
  frontend:
    image: ${PANEL_FRONTEND_IMAGE:-ghcr.io/acautomata/researcher-service/frontend:latest}
    container_name: panel-frontend
    restart: unless-stopped
    depends_on:
      - server
    ports:
      # 仅 loopback 暴露；BaoTa 边缘（Let's Encrypt TLS）反代 https://researcher.acautomata.top → 127.0.0.1:18080
      # 18080：避开宿主 8080（已被占用——CD run 30683051941 frontend Bind 失败）。
      - "127.0.0.1:18080:80"
    networks:
      - panel-net

  server:
    image: ${PANEL_SERVER_IMAGE:-ghcr.io/acautomata/researcher-service/server:latest}
    container_name: panel-server
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - redis      # 启动顺序：redis 先于 server（仅启动序，非就绪等待；entrypoint 落表阶段给 redis 留出窗口）
    environment:
      # 非敏感固定项：config.ts 唯一 env 读取处（server/src/config.ts）。
      NODE_ENV: production
      PORT: "8001"
      REDIS_URL: redis://redis:6379/0
      # SQLite 持久化：server 经 DATABASE_URL（Prisma driver adapter）读本 named volume 挂载点，
      # 容器重建数据不丢。必须显式绝对路径——apply-schema.mjs 的 file: 前缀剥离对绝对路径正确。
      DATABASE_URL: file:/app/db/db.sqlite3
      # 控制面落盘根（容器内路径，无宿主挂载；#858 前身 fleet 落盘根旧键）：现役唯一消费方 =
      # 附件上传临时区 <DATA_ROOT>/attachments（#780）。readDataRoot 生产校验绝对路径——显式 pin
      # 防相对路径 fallback。
      DATA_ROOT: /data
      # AutoFigure（#792 插件化收口起回归）：figure 生成 = server 进程内插件管线。
      # 三个必填键经 .env（env_file）注入，生产缺键 =
      # 启动期 assertPluginEnv fail-fast（不看启用位——任何用户随时可启用，面板必须永远备好）：
      #   AUTOFIGURE_IMAGE_MODEL        生图模型名（如 image-01）
      #   AUTOFIGURE_IMAGE_API_KEY      生图 API key（敏感，只走 .env）
      #   FAL_KEY                       fal 云计算 key（敏感，只走 .env）
      # 可选键：AUTOFIGURE_IMAGE_BASE_URL（缺省国际区）、AUTOFIGURE_SVG_MODEL（缺省 owner
      # 默认链 primary）。键声明单源 = plugins/autofigure/manifest.ts configSchema。
    volumes:
      # 唯一宿主数据挂载（ADR 0013 豁免）：控制面等价 root，经 docker.sock 编排面板自管容器
      # （spec §5.4 已明示风险）。其余数据（SQLite）走 named volume。
      - /var/run/docker.sock:/var/run/docker.sock
      # SQLite 持久化：server 经 DATABASE_URL 指向本 named volume 挂载点 /app/db/db.sqlite3，
      # 容器重建数据不丢。
      - panel-db:/app/db
    networks:
      - panel-net

  redis:
    image: redis:7-alpine
    container_name: panel-redis
    restart: unless-stopped
    # BullMQ 队列后端；仅内部网络，不对宿主暴露。
    networks:
      - panel-net


networks:
  panel-net:
    driver: bridge

volumes:
  panel-db:

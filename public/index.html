<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Research Pipeline</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans SC','Space Grotesk',sans-serif;background:#07090f;color:#e8ebf2;height:100vh;overflow:hidden}

.bg-glow{position:fixed;border-radius:50%;filter:blur(140px);opacity:.05;pointer-events:none;animation:gdr 24s ease-in-out infinite}
.bg-1{width:500px;height:500px;background:#00E5A0;top:-200px;left:-100px}
.bg-2{width:400px;height:400px;background:#A78BFA;bottom:-100px;right:-80px;animation-delay:-10s;animation-duration:30s}
@keyframes gdr{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(40px,-30px) scale(1.05)}}
.bg-grid{position:fixed;inset:0;z-index:0;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.015) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.015) 1px,transparent 1px);background-size:56px 56px}

.app{display:flex;height:100vh;position:relative;z-index:1}
.sidebar{width:240px;flex-shrink:0;background:#0d1019;border-right:1px solid rgba(255,255,255,.06);display:flex;flex-direction:column;overflow-y:auto;scrollbar-width:none}
.sidebar::-webkit-scrollbar{display:none}
.sb-head{padding:20px;border-bottom:1px solid rgba(255,255,255,.06);display:flex;align-items:center;gap:11px}
.sb-logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#00E5A0,#00D4FF);display:grid;place-items:center;font-size:14px;color:#07090f;flex-shrink:0}
.sb-name{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15px}
.sb-sub{font-size:10px;color:#464d65;margin-top:1px}
.sb-nav{padding:12px 8px;flex:1}
.sb-sec{font-size:10px;color:#464d65;text-transform:uppercase;letter-spacing:1.5px;padding:8px 12px 6px;font-weight:600}
.sb-btn{width:100%;display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;border:none;background:transparent;color:#7d849a;cursor:pointer;font-size:13px;font-weight:500;font-family:inherit;transition:all .2s ease;text-align:left}
.sb-btn:hover{background:rgba(255,255,255,.04);color:#c0c5d4}
.sb-btn.on{background:rgba(255,255,255,.06);color:#e8ebf2}
.sb-ico{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;font-size:14px;flex-shrink:0;transition:all .25s ease}
.sb-btn.on .sb-ico{color:#fff !important}
.sb-lb{flex:1;min-width:0;text-align:left}
.sb-lb small{display:block;font-size:10px;color:#464d65;margin-top:1px;font-weight:400}
.sb-sn{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-family:'Space Grotesk',sans-serif;font-size:10px;font-weight:700;background:rgba(255,255,255,.04);color:#464d65;flex-shrink:0;transition:all .25s ease}
.sb-div{height:1px;background:rgba(255,255,255,.06);margin:8px 12px}
.sb-ft{padding:14px 16px;border-top:1px solid rgba(255,255,255,.06);font-size:10px;color:#464d65;display:flex;align-items:center;gap:6px}
.sb-dot{width:5px;height:5px;border-radius:50%;background:#00E5A0;animation:pu 2s ease-in-out infinite}
@keyframes pu{0%,100%{opacity:1}50%{opacity:.3}}

.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.topbar{padding:14px 28px;border-bottom:1px solid rgba(255,255,255,.06);display:flex;align-items:center;justify-content:space-between;background:rgba(7,9,15,.7);backdrop-filter:blur(16px);flex-shrink:0;gap:16px}
.top-l{display:flex;align-items:center;gap:10px;min-width:0}
.top-ico{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-size:13px;flex-shrink:0}
.top-ti{font-size:15px;font-weight:700;white-space:nowrap}
.top-fl{display:flex;align-items:center;gap:6px;flex-shrink:0}
.top-fl .fd{width:8px;height:8px;border-radius:50%;opacity:.2;transition:all .3s ease}
.top-fl .fd.on{opacity:1;box-shadow:0 0 8px currentColor}
.top-fl .fl{width:20px;height:1.5px;background:rgba(255,255,255,.06);border-radius:1px}
.content{flex:1;overflow-y:auto;padding:24px 28px 40px;scrollbar-width:thin;scrollbar-color:#464d65 transparent}

.card{background:#111520;border:1px solid rgba(255,255,255,.06);border-radius:16px;padding:20px 22px;transition:border-color .25s ease}
.card:hover{border-color:rgba(255,255,255,.10)}
.card-t{font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px;margin-bottom:14px}
.card-t i{font-size:13px;opacity:.6}
.btn{padding:8px 16px;border-radius:9px;border:1px solid rgba(255,255,255,.06);background:rgba(255,255,255,.03);color:#e8ebf2;font-size:12px;font-family:inherit;cursor:pointer;transition:all .2s ease;font-weight:500;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.btn:hover{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.10)}
.bp{background:rgba(0,229,160,.12);border-color:rgba(0,229,160,.25);color:#00E5A0}
.bp:hover{background:rgba(0,229,160,.2);border-color:rgba(0,229,160,.4)}
.bw{background:rgba(245,166,35,.12);border-color:rgba(245,166,35,.25);color:#F5A623}
.bw:hover{background:rgba(245,166,35,.2)}
.bdr{background:rgba(255,107,129,.12);border-color:rgba(255,107,129,.2);color:#FF6B81}
.bdr:hover{background:rgba(255,107,129,.18)}
.btn:disabled{opacity:.3;cursor:not-allowed;pointer-events:none}
.inp{padding:9px 14px;border-radius:9px;border:1px solid rgba(255,255,255,.06);background:rgba(255,255,255,.03);color:#e8ebf2;font-size:12px;font-family:inherit;outline:none;transition:all .2s ease;width:100%}
.inp:focus{border-color:rgba(255,255,255,.15);background:rgba(255,255,255,.05)}
.inp::placeholder{color:#464d65}
select.inp{cursor:pointer;appearance:auto}

.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:100px;font-size:10px;font-weight:600;line-height:1.4}
.bdg-g{background:rgba(0,229,160,.12);color:#00E5A0}
.bdg-y{background:rgba(245,166,35,.12);color:#F5A623}
.bdg-p{background:rgba(167,139,250,.12);color:#A78BFA}
.bdg-r{background:rgba(255,107,129,.12);color:#FF6B81}
.bdg-m{background:rgba(255,255,255,.05);color:#7d849a}

.err-box{font-size:12px;color:#FF6B81;padding:10px 12px;border-radius:8px;background:rgba(255,107,129,.12);border:1px solid rgba(255,107,129,.15)}
.err-box i{margin-right:5px}

.stats{display:flex;gap:12px;margin-bottom:22px;flex-wrap:wrap}
.st-card{flex:1;min-width:110px;padding:16px 18px;border-radius:16px;background:#111520;border:1px solid rgba(255,255,255,.06)}
.st-v{font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:700;line-height:1}
.st-l{font-size:10px;color:#464d65;margin-top:4px;text-transform:uppercase;letter-spacing:.5px}

.tbl-w{overflow-x:auto;border-radius:16px;border:1px solid rgba(255,255,255,.06);background:#111520}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;padding:10px 14px;font-weight:600;color:#464d65;font-size:10px;text-transform:uppercase;letter-spacing:.8px;border-bottom:1px solid rgba(255,255,255,.06);background:rgba(255,255,255,.015)}
td{padding:10px 14px;border-bottom:1px solid rgba(255,255,255,.06)}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(255,255,255,.015)}

.upload-z{border:2px dashed rgba(255,255,255,.10);border-radius:16px;padding:36px 24px;text-align:center;cursor:pointer;transition:all .3s ease;background:rgba(255,255,255,.008)}
.upload-z:hover{border-color:rgba(0,229,160,.35);background:rgba(0,229,160,.02)}
.upload-z.drag{border-color:#00E5A0;background:rgba(0,229,160,.04)}
.upload-z .u-ico{font-size:34px;color:#464d65;margin-bottom:12px;display:block;transition:all .3s ease}
.upload-z:hover .u-ico{color:#00E5A0;transform:translateY(-3px)}
.upload-z .u-t{font-size:14px;color:#c0c5d4;margin-bottom:4px}
.upload-z .u-s{font-size:11px;color:#464d65}

.pbar{padding:14px 16px;border-radius:10px;border:1px solid rgba(0,229,160,.15);background:rgba(0,229,160,.03);margin-top:12px;display:none}
.pbar.on{display:block}
.pbar .pb-t{font-weight:600;font-size:12px;margin-bottom:8px;color:#00E5A0}
.pbar .pb-t i{margin-right:4px}
.p-step{display:flex;align-items:center;gap:9px;padding:4px 0;font-size:12px;color:#7d849a}
.p-step .pc{width:16px;height:16px;border-radius:50%;display:grid;place-items:center;font-size:8px;flex-shrink:0}
.p-step.dn .pc{background:#00E5A0;color:#07090f}
.p-step.rn .pc{border:2px solid #00E5A0;border-top-color:transparent;animation:sp .7s linear infinite;background:transparent}
.p-step.wt .pc{background:rgba(255,255,255,.06)}
@keyframes sp{to{transform:rotate(360deg)}}

.kw-tag{display:inline-flex;align-items:center;gap:4px;padding:4px 11px;border-radius:7px;font-size:11px;font-weight:500;border:1px solid rgba(255,255,255,.06);background:rgba(255,255,255,.015);transition:all .2s ease}
.kw-tag:hover{border-color:rgba(255,255,255,.10);background:rgba(255,255,255,.03)}
.kw-w{font-size:9px;color:#464d65;font-family:'Space Grotesk',sans-serif;margin-left:2px}
.api-t{display:inline-flex;align-items:center;padding:2px 7px;border-radius:4px;font-size:9px;font-weight:700;font-family:'Space Grotesk',monospace;letter-spacing:.3px}
.api-g{background:rgba(0,229,160,.12);color:#00E5A0}
.api-p{background:rgba(245,166,35,.12);color:#F5A623}
.api-d{background:rgba(255,107,129,.12);color:#FF6B81}
.src-t{display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:4px;font-size:9px;font-weight:600}
.src-k{background:rgba(0,229,160,.12);color:#00E5A0}
.src-e{background:rgba(0,212,255,.12);color:#00D4FF}
.src-a{background:rgba(167,139,250,.12);color:#A78BFA}

.code-blk{background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.06);border-radius:10px;padding:16px 18px;font-family:'Space Grotesk',monospace;font-size:12px;line-height:1.75;color:#7d849a;overflow-x:auto;position:relative;white-space:pre-wrap;word-break:break-all}
.code-blk .ccp{position:absolute;top:8px;right:8px;padding:4px 10px;border-radius:6px;border:1px solid rgba(255,255,255,.06);background:rgba(255,255,255,.03);color:#464d65;font-size:10px;cursor:pointer;transition:all .2s ease;font-family:inherit}
.code-blk .ccp:hover{color:#e8ebf2;background:rgba(255,255,255,.07)}

.score-row{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.score-row .sl{font-size:10px;color:#464d65;width:42px;flex-shrink:0}
.score-row .sbar{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.05);overflow:hidden}
.score-row .sf{height:100%;border-radius:2px}
.score-row .sn{font-size:11px;font-family:'Space Grotesk',sans-serif;font-weight:600;width:26px;text-align:right;flex-shrink:0}

.li-item{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;border-radius:10px;border:1px solid rgba(255,255,255,.06);background:rgba(255,255,255,.008);margin-bottom:8px;transition:all .2s ease}
.li-item:hover{border-color:rgba(255,255,255,.10);background:rgba(255,255,255,.02)}
.li-ic{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;font-size:15px;flex-shrink:0}
.li-nm{font-weight:600;font-size:13px}
.li-mt{font-size:11px;color:#464d65;margin-top:2px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}

.prob-card{padding:14px 16px;border-radius:16px;border:1px solid rgba(255,255,255,.06);background:rgba(255,255,255,.008);margin-bottom:8px;transition:all .2s ease}
.prob-card:hover{border-color:rgba(255,255,255,.10);background:rgba(255,255,255,.02)}

.idea-card{padding:16px 18px;border-radius:16px;border:1px solid rgba(255,255,255,.06);background:#111520;transition:all .25s ease;margin-bottom:10px}
.idea-card:hover{border-color:rgba(255,255,255,.10);background:#161b2a}

.api-ep{padding:12px 14px;border-radius:10px;border:1px solid rgba(255,255,255,.06);margin-bottom:6px;background:rgba(255,255,255,.008)}
.api-ep:hover{border-color:rgba(255,255,255,.10)}
.api-path{font-family:'Space Grotesk',monospace;font-size:12px;font-weight:600;margin-bottom:3px;display:flex;align-items:center;gap:6px}
.api-desc{font-size:11px;color:#7d849a;margin-bottom:4px}
.api-params{font-size:10px;color:#464d65}
.api-params code{background:rgba(255,255,255,.04);padding:1px 5px;border-radius:3px;font-family:'Space Grotesk',monospace;font-size:10px;color:#7d849a}

.flex-b{display:flex;justify-content:space-between;align-items:center}
.mb8{margin-bottom:8px}.mb12{margin-bottom:12px}.mb16{margin-bottom:16px}.mb24{margin-bottom:24px}

.tbox{position:fixed;top:14px;right:14px;z-index:999;display:flex;flex-direction:column;gap:8px}
.tst{padding:10px 16px;border-radius:10px;background:#131722;border:1px solid rgba(255,255,255,.10);color:#e8ebf2;font-size:12px;display:flex;align-items:center;gap:8px;box-shadow:0 8px 32px rgba(0,0,0,.4);animation:tin .3s ease,tout .3s ease 2.5s forwards}
@keyframes tin{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:translateX(0)}}
@keyframes tout{from{opacity:1}to{opacity:0;transform:translateX(30px)}}

@media(max-width:860px){
  .sidebar{width:56px}
  .sidebar .sb-name,.sidebar .sb-sub,.sidebar .sb-sec,.sidebar .sb-lb,.sidebar .sb-sn,.sidebar .sb-div,.sidebar .sb-ft span{display:none}
  .sidebar .sb-btn{justify-content:center;padding:10px}
  .sidebar .sb-ico{margin:0}
  .content{padding:16px}
}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}
</style>
</head>
<body>

<div class="bg-glow bg-1"></div>
<div class="bg-glow bg-2"></div>
<div class="bg-grid"></div>
<div class="tbox" id="tbox"></div>

<div class="app">
  <aside class="sidebar" id="sideEl"></aside>
  <div class="main">
    <header class="topbar" id="topEl"></header>
    <div class="content" id="ctnEl"></div>
  </div>
</div>

<script>
var API = '/api/v1';

var P = [
  {id:'kb',  name:'知识库构建与更新',     icon:'fa-database',              color:'#00E5A0', step:1, desc:'上传文献，解析关键字'},
  {id:'lit', name:'文献问题发现与验证',   icon:'fa-magnifying-glass-chart', color:'#F5A623', step:2, desc:'分析验证文献问题'},
  {id:'idea',name:'Idea生成与验证分析',   icon:'fa-lightbulb',             color:'#A78BFA', step:3, desc:'生成评价研究创意'},
  {id:'algo',name:'算法自动实现与优化',   icon:'fa-code',                  color:'#FF6B81', step:4, desc:'输出算法代码'},
  {id:'agent',name:'Agent 终端控制台',    icon:'fa-terminal',              color:'#00D4FF', step:5, desc:'Claude Agent 交互'},
  {id:'doc', name:'需求与API文档',        icon:'fa-book',                  color:'#7d849a', step:0, desc:'规范与接口定义'}
];

var cur = 'kb', pI = null;
var cache = { papers:[], entries:[], keywords:[], problems:[], ideas:[], algos:[] };

/* ===== API 工具 ===== */
async function api(method, path, body) {
  var opts = { method: method, headers: {'Content-Type':'application/json'} };
  if (body) opts.body = JSON.stringify(body);
  var resp = await fetch(API + path, opts);
  if (!resp.ok) {
    var err = await resp.json().catch(function(){ return {detail: resp.statusText}; });
    throw new Error(err.detail || '请求失败');
  }
  return resp.json();
}

async function apiUpload(files) {
  var fd = new FormData();
  for (var i = 0; i < files.length; i++) fd.append('files', files[i]);
  var resp = await fetch(API + '/kb/upload', { method:'POST', body: fd });
  if (!resp.ok) throw new Error('上传失败');
  return resp.json();
}

function pollTask(taskId, urlTpl, steps, barId, onDone) {
  var idx = 0;
  var iv = setInterval(async function() {
    try {
      var data = await api('GET', urlTpl.replace('{task_id}', taskId));
      var target = Math.min(Math.floor(data.progress / 25), steps.length - 1);
      while (idx <= target && idx < steps.length) {
        var el = document.getElementById(steps[idx]);
        if (el) {
          if (data.status === 'completed') el.className = 'p-step dn';
          else if (idx === target) {
            el.className = 'p-step rn';
            if (idx > 0) { var prev = document.getElementById(steps[idx-1]); if (prev) prev.className = 'p-step dn'; }
          }
        }
        idx++;
      }
      if (data.status === 'completed') {
        clearInterval(iv);
        for (var s = 0; s < steps.length; s++) { var el = document.getElementById(steps[s]); if (el) el.className = 'p-step dn'; }
        var bar = document.getElementById(barId); if (bar) bar.classList.remove('on');
        onDone(data.result);
      } else if (data.status === 'error') {
        clearInterval(iv);
        var bar = document.getElementById(barId); if (bar) bar.classList.remove('on');
        toast(data.error || '任务失败', 'fa-exclamation-circle', '#FF6B81');
      }
    } catch(e) { clearInterval(iv); toast('轮询异常: '+e.message, 'fa-exclamation-circle', '#FF6B81'); }
  }, 1200);
  return iv;
}

/* ===== 数据加载 ===== */
async function loadPapers() {
  try {
    var data = await api('GET', '/kb/entries');
    cache.entries = data.entries || [];
    var srcMap = {};
    cache.entries.forEach(function(e){ if(e.source) srcMap[e.source]=true; });
    cache.papers = Object.keys(srcMap).map(function(s){ return {name:s, ok:true}; });
  } catch(e) { cache.entries=[]; cache.papers=[]; }
}

async function loadKeywords() {
  try {
    var data = await api('GET', '/kb/keywords?limit=200');
    cache.keywords = (data.keywords || []).map(function(k){ return {word:k.word, weight:k.weight, cat:k.category}; });
  } catch(e) { cache.keywords=[]; }
}

async function loadProblems() {
  try {
    var data = await api('GET', '/lit/problems');
    cache.problems = (data.problems || []).map(function(p){
      return { id:p.id, title:p.title, desc:p.description, src:p.source, srcType:p.source_type,
               cat:p.category, sv:p.severity, ok:!!p.validated, ing:!!p.validating, vs:p.validation_score, vm:p.validation_method };
    });
  } catch(e) { cache.problems=[]; }
}

async function loadIdeas() {
  try {
    var data = await api('GET', '/idea/list?min_score=0');
    cache.ideas = (data.ideas || []).map(function(i){
      return { id:i.id, title:i.title, desc:i.description, fp:i.from_problem, nv:i.novelty, fb:i.feasibility, im:i.impact, os:i.overall_score };
    });
  } catch(e) { cache.ideas=[]; }
}

async function loadAlgos() {
  try {
    var data = await api('GET', '/algo/list');
    cache.algos = (data.algorithms || []).map(function(a){
      return { id:a.id, name:a.name, code:a.code, lang:a.language, fi:a.from_idea,
               ok:!!a.tested, ing:!!a.testing, tp:a.test_passed, tt:a.test_total, pb:a.perf_before_ms, pa:a.perf_after_ms };
    });
  } catch(e) { /* keep existing */ }
}

/* ===== 工具 ===== */
function toast(m,i,c){i=i||'fa-check-circle';c=c||'#00E5A0';var t=document.createElement('div');t.className='tst';t.innerHTML='<i class="fa-solid '+i+'" style="color:'+c+'"></i>'+m;document.getElementById('tbox').appendChild(t);setTimeout(function(){if(t.parentNode)t.remove()},3000)}
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function cc(cat){return{'深度学习':'#00E5A0','表征学习':'#A78BFA','图学习':'#F5A623','生成模型':'#FF6B81','强化学习':'#00D4FF','多模态':'#34D399','NLP':'#F9A8D4'}[cat]||'#7d849a'}

/* ===== 导航 ===== */
function buildNav(){
  var h='<div class="sb-head"><div class="sb-logo"><i class="fa-solid fa-brain"></i></div><div><div class="sb-name">AI Pipeline</div><div class="sb-sub">Research Automation</div></div></div><div class="sb-nav"><div class="sb-sec">Pipeline 步骤</div>';
  for(var i=0;i<P.length;i++){
    var p=P[i], act=cur===p.id;
    if(i===4) h+='<div class="sb-div"></div><div class="sb-sec">文档</div>';
    h+='<button class="sb-btn'+(act?' on':'')+'" onclick="go(\''+p.id+'\')">';

function buildTop(){
  var p=P.find(function(x){return x.id===cur});
  var h='<div class="top-l"><span class="top-ico" style="background:'+p.color+'18;color:'+p.color+'"><i class="fa-solid '+p.icon+'"></i></span><span class="top-ti">'+p.name+'</span></div><div class="top-fl">';
  var sp=P.filter(function(x){return x.step>0});
  for(var i=0;i<sp.length;i++){h+='<span class="fd'+(cur===sp[i].id?' on':'')+'" style="background:'+sp[i].color+';color:'+sp[i].color+'"></span>';if(i<sp.length-1)h+='<span class="fl"></span>';}
  h+='</div>';
  document.getElementById('topEl').innerHTML=h;

async function go(id){
  if(pI){clearInterval(pI);pI=null}

var agEvt = null, agLogLines = 0, agResultText = '', agToolsUsed = [];

function clearAgentLog() {
  var el = document.getElementById('agLog');
  if (el) el.innerHTML = '<div style="color:#464d65">日志已清空</div>';
  agLogLines = 0;
  agResultText = '';
  agToolsUsed = [];
  var rc = document.getElementById('agResultCard');
  if (rc) rc.style.display = 'none';
  var rr = document.getElementById('agResult');
  if (rr) rr.innerHTML = '';
}

function appendLog(type, content, extra) {
  var el = document.getElementById('agLog');
  if (!el) return;
  if (agLogLines === 0) el.innerHTML = '';
  agLogLines++;
  var colors = {
    system: '#464d65', text: '#e8ebf2', thinking: '#7d849a',
    tool_use: '#F5A623', tool_result: '#464d65', tool_error: '#FF6B81',
    result: '#00E5A0', error: '#FF6B81', stderr: '#464d65'
  };
  var c = colors[type] || '#7d849a';
  var icon = '';
  if (type === 'tool_use') icon = '<i class="fa-solid fa-wrench" style="font-size:10px;margin-right:4px;color:#F5A623"></i>';
  else if (type === 'thinking') icon = '<i class="fa-solid fa-brain" style="font-size:10px;margin-right:4px;color:#7d849a"></i>';
  else if (type === 'error') icon = '<i class="fa-solid fa-circle-exclamation" style="font-size:10px;margin-right:4px;color:#FF6B81"></i>';
  else if (type === 'result') icon = '<i class="fa-solid fa-circle-check" style="font-size:10px;margin-right:4px;color:#00E5A0"></i>';
  else if (type === 'tool_result') icon = '<i class="fa-solid fa-arrow-turn-down" style="font-size:9px;margin-right:4px;color:#464d65"></i>';
  var line = '<div style="color:' + c + ';padding:2px 0;' + (type === 'thinking' ? 'font-style:italic;' : '') + '">';
  line += icon + esc(content);
  if (extra) line += ' <span style="color:#464d65;font-size:9px">' + extra + '</span>';
  line += '</div>';
  el.innerHTML += line;
  el.scrollTop = el.scrollHeight;
}

function updateResult() {
  var rc = document.getElementById('agResultCard');
  var rr = document.getElementById('agResult');
  var rm = document.getElementById('agResultMeta');
  if (!rc || !rr) return;
  if (agResultText.trim()) {
    rc.style.display = '';
    // 简单 Markdown 渲染: 代码块、加粗、换行
    var html = agResultText
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/```(\w*)\n([\s\S]*?)```/g, function(_, lang, code) {
        return '<pre style="background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.06);border-radius:8px;padding:12px;overflow-x:auto;margin:8px 0;font-family:Space Grotesk,monospace;font-size:12px;line-height:1.6;color:#7d849a;white-space:pre-wrap">' + code.trim() + '</pre>';
      })
      .replace(/\*\*(.+?)\*\*/g, '<strong style="color:#e8ebf2">$1</strong>')
      .replace(/`([^`]+)`/g, '<code style="background:rgba(0,229,160,.12);color:#00E5A0;padding:1px 6px;border-radius:4px;font-family:Space Grotesk,monospace;font-size:11px">$1</code>')
      .replace(/\n/g, '<br>');
    rr.innerHTML = html;
    if (rm && agToolsUsed.length) rm.textContent = '· 工具调用: ' + agToolsUsed.join(', ');
  }
}

function copyResult() {
  navigator.clipboard.writeText(agResultText);
  toast('已复制', 'fa-copy', '#00D4FF');
}

function renderAgentEvent(d) {
  if (!d || d.type === 'heartbeat') return;
  if (d.type === 'done') {
    appendLog('system', '会话结束');
    return;
  }
  if (d.type === 'error') {
    appendLog('error', d.text || '未知错误');
    return;
  }
  if (d.type === 'assistant') {
    var blocks = d.blocks || [];
    blocks.forEach(function(b) {
      if (b.type === 'text') {
        appendLog('text', b.text);
        agResultText += b.text + '\n';
        updateResult();
      }
      else if (b.type === 'thinking') appendLog('thinking', b.text);
      else if (b.type === 'tool_use') {
        appendLog('tool_use', b.name, 'id: ' + b.id.slice(0, 12));
        if (agToolsUsed.indexOf(b.name) === -1) agToolsUsed.push(b.name);
      }
      else if (b.type === 'tool_result') appendLog(b.is_error ? 'tool_error' : 'tool_result', (b.content || '').slice(0, 300), b.is_error ? '错误' : '');
    });
    return;
  }
  if (d.type === 'result') {
    document.getElementById('agTurnsStat').textContent = d.num_turns || '-';
    document.getElementById('agTurnsStat').style.color = '#F5A623';
    if (d.total_cost_usd != null) {
      document.getElementById('agCostStat').textContent = '$' + d.total_cost_usd.toFixed(4);
      document.getElementById('agCostStat').style.color = '#00D4FF';
    }
    appendLog('result', '完成 · ' + (d.num_turns || '?') + ' 轮 · $' + ((d.total_cost_usd || 0).toFixed(4)) + ' · ' + (d.duration_ms ? (d.duration_ms/1000).toFixed(1)+'s' : ''));
    if (d.errors && d.errors.length) d.errors.forEach(function(e) { appendLog('error', e); });
    if (d.is_error) appendLog('error', 'Agent 执行异常');
    updateResult();
    return;
  }
  if (d.type === 'user') {
    var blks = d.blocks || [];
    blks.forEach(function(b) { if (b.type === 'text') appendLog('system', '[用户] ' + b.text); });
    return;
  }
  if (d.type === 'stderr') {
    appendLog('stderr', d.text);
    return;
  }
  if (d.type === 'system') {
    appendLog('system', '[系统] ' + (d.subtype || '') + ' · cwd: ' + (d.data || ''));
    return;
  }
  appendLog('system', JSON.stringify(d).slice(0, 200));
}

async function startAgent() {
  var prompt = document.getElementById('agPrompt');
  if (!prompt || !prompt.value.trim()) return;
  stopAgent();
  clearAgentLog();
  appendLog('system', '正在启动 Agent...');
  document.getElementById('agBtn').style.display = 'none';
  document.getElementById('agStopBtn').style.display = '';
  document.getElementById('agStat').textContent = '运行中';
  document.getElementById('agStat').style.color = '#F5A623';
  document.getElementById('agTurnsStat').textContent = '-';
  document.getElementById('agCostStat').textContent = '-';
  try {
    var cwd = document.getElementById('agCwd');
    var turns = document.getElementById('agTurns');
    var data = await api('POST', '/agent/chat', {
      prompt: prompt.value,
      cwd: cwd ? cwd.value : '.',
      max_turns: turns ? parseInt(turns.value) : 10
    });
    agEvt = new EventSource(API + '/agent/chat/' + data.task_id + '/stream');
    agEvt.onmessage = function(e) {
      try {
        var d = JSON.parse(e.data);
        renderAgentEvent(d);
        if (d.type === 'done') finishAgent(d.type === 'error' ? '错误' : '完成', d.type === 'error' ? '#FF6B81' : '#00E5A0');
      } catch(ex) {}
    };
    agEvt.onerror = function() {
      finishAgent('连接断开', '#FF6B81');
    };
  } catch(e) {
    appendLog('error', '启动失败: ' + e.message);
    finishAgent('失败', '#FF6B81');
  }
}

function finishAgent(status, color) {
  if (agEvt) { agEvt.close(); agEvt = null; }
  document.getElementById('agBtn').style.display = '';
  document.getElementById('agStopBtn').style.display = 'none';
  document.getElementById('agStat').textContent = status;
  document.getElementById('agStat').style.color = color;
}

function stopAgent() {
  if (agEvt) { agEvt.close(); agEvt = null; }
  document.getElementById('agBtn').style.display = '';
  document.getElementById('agStopBtn').style.display = 'none';
  document.getElementById('agStat').textContent = '已停止';
  document.getElementById('agStat').style.color = '#FF6B81';
  appendLog('system', '已手动停止');
}

/* ===== 启动 ===== */
buildNav();
buildTop();
go('kb');
</script>
</body>
</html>

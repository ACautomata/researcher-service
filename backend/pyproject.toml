# backend 测试配置 —— pytest + pytest-django
# spec: docs/FULLSTACK-REFACTOR-SPEC.md；issue #37 P0 骨架
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# integration marker：真容器集成测试（需 docker daemon + OPENCLAW_TEMPLATE_DIR/LLM_API_KEY env）。
# backend-unit job 跑 `-m "not integration"` 排除（契约：不跑真容器）；integration job env 齐备
# 跑 `-m "integration"` 真验证（issue #157：集成测试 CI 必须一直跑，环境齐备，不 skip）。
markers = [
    "integration: 真容器集成测试（CI integration job 跑，需 docker + OPENCLAW_TEMPLATE_DIR/LLM_API_KEY）",
]

[tool.ruff]
line-length = 100
target-version = "py313"
# Django 自动生成的 migrations 不纳入检查（对齐 pylint ignore-paths = [".*/migrations/.*"]）
extend-exclude = ["**/migrations"]

[tool.ruff.lint]
# 规则分配见 docs/ruff-pylint-boundary.md
# 现只开低噪、可自动修复的规则族；Q/B/S 为 aspirational（待后续收敛）
extend-select = [
    "I",       # isort（import 排序）
    "COM",     # flake8-commas（尾逗号）
    "PIE",     # flake8-pie（禁止模式）
]
# 全局静默：被 docs/ruff-pylint-boundary.md §45/§46 定性为"故障隔离、有意为之"的异常处理模式
# （容器编排/事件翻译等模块靠宽捕获 + 静默续命做故障隔离，改语义会破坏该不变量）
extend-ignore = [
    "BLE001",  # blind-except：宽捕获是故障隔离模式（文档§45）
    "S110",    # try-except-pass：静默吞异常是故障隔离模式（文档§46）
    "S112",    # try-except-continue：同上
]

# I001 isort 的 known-first-party
[tool.ruff.lint.isort]
known-first-party = ["accounts", "chat", "common", "config", "containers", "models", "wiki"]

# ---- pylint：语义/类型层（风格交给 ruff，见 [tool.ruff]）----
[tool.pylint.MAIN]
load-plugins = "pylint_django"
django-settings-module = "config.settings.dev"
py-version = "3.13"
jobs = 0                      # 0 = 按 CPU 核数并行
ignore-paths = [".*/migrations/.*"]   # migrations 由 Django 生成，不纳入语义检查

[tool.pylint."MESSAGES CONTROL"]
# 三类一并收敛：(a) 与 ruff 默认集重叠避免双报；(b) Django/DRF/pytest 已知误报；(c) 本仓 baseline 不追求的风格项
disable = [
    # (a) ruff 已管（pyflakes/pycodestyle 重叠，交 ruff 单一来源）
    "line-too-long",            # ruff E501
    "unused-import",            # ruff F401
    "unused-variable",          # ruff F841
    "wildcard-import",          # ruff F403（settings dev/prod 的 import * 是有意的）
    "unused-wildcard-import",   # ruff F403
    "wrong-import-order",       # 交给 ruff I（isort）边界，本仓未开 I 则此条静默
    "ungrouped-imports",
    "wrong-import-position",
    "reimported",
    # (b) Django/DRF/pytest 已知误报（实测命中，app 源码层面价值低）
    "abstract-method",          # W0223 DRF Serializer.create/update 误报 ×37
    "redefined-outer-name",     # W0621 pytest fixture 注入与外层重名 ×441（几乎全在 tests）
    "unused-argument",          # W0613 pytest fixture 形参(db/api)不都用 ×125
    "import-outside-toplevel",  # C0415 测试/ASGI 内局部 import 是惯例 ×49
    "protected-access",         # W0212 测试触私有方法 _run_handshake 等 ×36
    # (c) 本仓 baseline：不追求全开严格度
    "missing-docstring",        # C0114/0115/0116 docstring 不强制
    "too-few-public-methods",   # R0903 Django Model/Form/Serializer/Meta 天然触发
    "too-many-ancestors",       # R0901 DRF generic view 继承链深是正常的
    "fixme",                    # W0511 TODO/FIXME 注释不报警
    "duplicate-code",           # R0801 噪音大、价值低
    # (c) 类别B（issue #130）：WS 长连状态机的字段聚合是合理内聚，非坏味道。
    #     OpenClawWireClient(15/10)（#231 收敛自 OpenClawWireAdapter/活 client）与其 fake(18/10) 的
    #     ws/cm/recv_task/pending_acks/pending_resolves/… 同属一条长连接的生命周期状态，与上面
    #     too-many-ancestors 同策略静默。
    "too-many-instance-attributes",  # R0902
    # 说明：issue #130 的 W0718(broad-exception-caught) 与 C2801(unnecessary-dunder-call)
    # 不在此全局 disable —— 按 docs/ruff-pylint-boundary.md §45/维护约定，有意的故障隔离
    # 宽捕获与长连 CM 手动管理统一在源码对应点做局部豁免（# pylint: disable=...），
    # 避免全 backend 的意外宽捕获绕过 pylint（ruff BLE001 已全局 ignore，无兜底）。
]
# 说明：no-member 不在 disable 之列 —— pylint-django 已正确抑制 ORM 误报，保留以抓真实属性错误。

[tool.pylint.BASIC]
good-names = ["i", "j", "k", "e", "f", "_", "pk", "id", "qs", "db"]

[tool.pylint.DESIGN]
max-args = 7                  # 放宽默认，减少 too-many-* 设计气味噪音
max-locals = 20
max-branches = 15
max-attributes = 10

# frontend nginx —— 单容器入口（BaoTa 边缘 TLS 反代到本容器 127.0.0.1:18080）。
# 路由：/ → SPA(dist) + history fallback；/api → server:8001（TS/Express 控制面，#341 M9）。
# 前端为 origin-relative，故全部同源，无 CORS。

# 代理解析 server 服务名：compose 内部网络靠 Docker 内嵌 DNS，需显式 resolver 让
# proxy_pass 变量/域名在运行时解析（容器重建后 IP 变化也能跟随）。
upstream backend_api {
    server server:8001;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip 静态资源（Vue chunk 较大）。
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ---- SSE 事件流（/api/v1/events，#747 C 节 / issue #773）----
    # 单工流：无 Upgrade/Connection 透传（那是 WS 语义）。核心两条：
    #   proxy_buffering off —— 禁代理层攒帧（应用层已发 X-Accel-Buffering: no，双侧互锁）；
    #   读超时 3600s —— 20s :ping 心跳间隙绝不触发代理掐断。
    # 精确匹配 location 优先于下方 /api/ 泛前缀。
    location = /api/v1/events {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---- REST API（/api/* → Express 信封）----
    # 慢 API（创建容器 docker run 等）可超默认 60s；
    # 放宽读/写超时避免代理掐断返回 504。
    location /api/ {
        proxy_pass http://backend_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ---- admin 子应用 MPA（#800）----
    # /admin/ 分流到 admin.html（admin 独立入口 + 独立路由表/bundle，产物级隔离）；
    # 必须先于下方 SPA history fallback 命中——否则被 / 的 try_files 吞进用户面板 index.html。
    # /admin（无尾斜杠）301 到 /admin/（try_files 不处理目录重定向，直接显式）。
    location = /admin {
        return 301 /admin/;
    }
    location /admin/ {
        try_files $uri $uri/ /admin.html;
    }
    location = /admin.html {
        add_header Cache-Control "no-cache";
    }

    # ---- SPA 静态资源 + Vue Router history fallback ----
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带指纹的构建产物长缓存；index.html 不缓存以保证发版即生效。
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}

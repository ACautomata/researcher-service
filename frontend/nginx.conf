# frontend nginx —— 单容器入口（BaoTa 边缘 TLS 反代到本容器 127.0.0.1:8080）。
# 路由：/ → SPA(dist) + history fallback；/api、/ws → backend:8000（Daphne）。
# 前端为 origin-relative，故全部同源，无 CORS。

# 代理解析 backend 服务名：compose 内部网络靠 Docker 内嵌 DNS，需显式 resolver 让
# proxy_pass 变量/域名在运行时解析（容器重建后 IP 变化也能跟随）。
upstream backend_api {
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip 静态资源（Vue chunk 较大）。
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ---- WebSocket（/ws/chat/ → Channels ChatConsumer）----
    # 必须透传 Upgrade/Connection，否则握手无法升级为 WS（对齐 vite.config ws:true）。
    # JWT 经 Sec-WebSocket-Protocol 子协议传递（access_token），原样转发即可。
    location /ws/ {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WS 长连接：放宽读超时，避免空闲心跳间隙被 nginx 切断。
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---- REST API（/api/* → DRF）----
    location /api/ {
        proxy_pass http://backend_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- SPA 静态资源 + Vue Router history fallback ----
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带指纹的构建产物长缓存；index.html 不缓存以保证发版即生效。
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}

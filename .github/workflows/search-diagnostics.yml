name: Search diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect internal search availability
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            set -eu
            docker ps --filter name=panel-search --format '{{.Names}} {{.Status}}'
            docker exec panel-search python -c '
            import urllib.request, urllib.parse, json
            for engine in ["360search", "sogou", "bilibili", "sogou videos"]:
                query = {"q":"线性代数 特征值 特征向量", "format":"json", "language":"zh-CN"}
                if engine: query["engines"] = engine
                try:
                    data = json.load(urllib.request.urlopen("http://127.0.0.1:8080/search?"+urllib.parse.urlencode(query), timeout=15))
                    print(json.dumps({"engine":engine or "default", "results":len(data.get("results",[])), "samples":[{"title":x.get("title"),"url":x.get("url")} for x in data.get("results",[])[:3]], "failures":data.get("unresponsive_engines",[])}, ensure_ascii=False))
                except Exception as e: print(json.dumps({"engine":engine,"error":str(e)}))
            '

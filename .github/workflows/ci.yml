# GitHub Actions CI —— issue #91（skeleton + frontend job）、issue #92（backend-unit pytest）、
# issue #93（backend-unit pylint 语义层质量门）、issue #157（integration 真容器集成测试）。
# 父票 #74。push 触发；frontend / backend-unit / integration 三轨并行把关
# （vitest + vue-tsc / 单测 pytest + pylint / 真容器集成 pytest），任一红即拦。
name: CI

on: push

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # 对齐 frontend/package-lock.json 的 LTS（约束 ^20.19.0||^22.12.0||>=24.0.0）
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test
      - run: npm run build

  backend-unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements/dev.txt
      - run: pip install -r requirements/dev.txt
      # 排除真容器集成测试（-m "not integration"）：backend-unit 不跑真容器（契约由
      # tests/test_ci_workflow.py 守），集成测试在 integration job env 齐备时真跑（issue #157）。
      - run: python -m pytest -m "not integration"
      # 语义层质量门（#93）：pylint 接管 ruff 不管的语义/类型层——调用参数错误、ORM/Django
      # 误用、异常规范、设计气味。退出码非零即 job 红。配置（django-settings-module、
      # pylint-django 插件、migrations 忽略）集中在 pyproject.toml（#77 落地），无需 env 兜底。
      - run: pylint accounts chat config containers models wiki

  # 真容器集成测试（issue #157）：env 齐备时真跑 chat.send wire schema 断言 + 全链路 smoke。
  # 与 backend-unit 分离——backend-unit 保持「不跑真容器」契约（test_ci_workflow 守），
  # 集成测试在此 job 经 docker daemon + OPENCLAW_TEMPLATE_DIR/LLM_API_KEY 真验证（不 skip）。
  # LLM_API_KEY 须在 repo secrets 配齐（缺失则集成测试 fail 暴露配置问题，符合「环境必须齐备」）。
  integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      OPENCLAW_TEMPLATE_DIR: ${{ github.workspace }}
      OPENCLAW_IMAGE: ghcr.io/openclaw/openclaw:2026.7.1-browser
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          # 联调集成测试（#179）需 Playwright：integration.txt 是 dev.txt 超集
          cache-dependency-path: backend/requirements/integration.txt
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # 联调测试用 Playwright 驱动真浏览器经 Vite proxy（#179）；wire schema 用 docker gateway
      - run: pip install -r requirements/integration.txt
      - run: python -m playwright install --with-deps chromium
      # 联调 conftest 起 vite dev server，需 frontend 依赖
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      # npm ci 在 frontend/node_modules（~200-500MB）内生依赖树。HomeProvisioner 用 shutil.copytree
      # 将整个 OPENCLAW_TEMPLATE_DIR（当前 workspace）递归拷入每个 OpenClaw 容器的临时 home；
      # 7+ case 叠加拷入数百 MB/node_modules，I/O 暴增（codex #185 P2）。建一份排除 frontend/ 的
      # 清理模板——容器不需要 web UI 文件。
      - name: Create clean fleet template (exclude frontend from copytree)
        run: |
          rsync -a --exclude='frontend/' "${{ github.workspace }}/" /tmp/fleet-template/
          echo "OPENCLAW_TEMPLATE_DIR=/tmp/fleet-template" >> "$GITHUB_ENV"
      # 预拉 OpenClaw 公共 ghcr 镜像（wire schema 集成测试须容器起停）
      - run: docker pull ${{ env.OPENCLAW_IMAGE }}
      # 真容器/真链路集成测试（pytestmark=integration）：wire schema（docker gateway）+
      # 联调 health 契约（vite proxy × playwright × live Django，#179）
      - run: python -m pytest -m "integration"

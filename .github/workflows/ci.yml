# GitHub Actions CI —— issue #91（skeleton + frontend job）、issue #93（server 质量门）。父票 #74。
# push 触发；frontend / server 双轨并行把关（vitest + vue-tsc / Express vitest + tsc + build），
# 任一红即拦。Django backend-unit（旧 #92/#93 pytest + pylint）随 #341 M9 退役删除。
name: CI

on: push

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # 对齐 frontend/package-lock.json 的 LTS（约束 ^20.19.0||^22.12.0||>=24.0.0）
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test
      - run: npm run build

  # Express 控制面（server/，#333 M0+M1）：prisma generate + tsc + vitest + build 全绿才算通过。
  # Codex #342 ⑲ P2：此前 CI 只跑 frontend/Django，server 破坏编译/生成 client/44 认证用例 CI 仍绿。
  # src/generated 被 gitignore（fresh checkout 无此目录），但 typecheck/test 都 import 生成产物 ——
  # 故 typecheck/test 前必须先跑 prisma generate（build 的 prebuild 钩子会自动做，但顺序上 typecheck
  # 在其前，须显式生成一次）。
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run typecheck
      #（沙箱/wiki 容器 smoke 用 busybox 级钉版镜像，体积小无需预拉；#858/#860 OpenClaw 退役面
      # 断言于 test/openclawRetirement.test.ts。）
      - run: npm test
      - run: npm run build

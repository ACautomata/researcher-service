# GitHub Actions CI —— issue #91（skeleton + frontend job）、issue #92（backend-unit pytest）、
# issue #93（backend-unit pylint 语义层质量门）。父票 #74。push 触发；
# frontend / backend-unit / server 三轨并行把关（vitest + vue-tsc / 单测 pytest + pylint /
# Express vitest + tsc + build），任一红即拦。真容器 Python 集成测试（旧 #157）流程已删除。
name: CI

on: push

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # 对齐 frontend/package-lock.json 的 LTS（约束 ^20.19.0||^22.12.0||>=24.0.0）
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test
      - run: npm run build

  backend-unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements/dev.txt
      - run: pip install -r requirements/dev.txt
      # 排除真容器集成测试（-m "not integration"）：backend-unit 不跑真容器（契约由
      # tests/test_ci_workflow.py 守）。真容器 Python 集成测试流程已删除。
      - run: python -m pytest -m "not integration"
      # 语义层质量门（#93）：pylint 接管 ruff 不管的语义/类型层——调用参数错误、ORM/Django
      # 误用、异常规范、设计气味。退出码非零即 job 红。配置（django-settings-module、
      # pylint-django 插件、migrations 忽略）集中在 pyproject.toml（#77 落地），无需 env 兜底。
      - run: pylint accounts chat config containers models wiki

  # Express 控制面（server/，#333 M0+M1）：prisma generate + tsc + vitest + build 全绿才算通过。
  # Codex #342 ⑲ P2：此前 CI 只跑 frontend/Django，server 破坏编译/生成 client/44 认证用例 CI 仍绿。
  # src/generated 被 gitignore（fresh checkout 无此目录），但 typecheck/test 都 import 生成产物 ——
  # 故 typecheck/test 前必须先跑 prisma generate（build 的 prebuild 钩子会自动做，但顺序上 typecheck
  # 在其前，须显式生成一次）。
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      # 与 test/containers-smoke 默认同源（smoke 读 process.env.OPENCLAW_IMAGE ?? 默认 tag）。
      # CI runner 自带 docker daemon → smoke 门控放行真跑（区别于本地无 daemon 时 skip），
      # 故须预拉镜像，否则 create 拉镜像 404 让 smoke 红（镜像缺失是环境问题，非代码问题）。
      OPENCLAW_IMAGE: ghcr.io/openclaw/openclaw:2026.7.1-browser
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run typecheck
      # 预拉 OpenClaw 公共 ghcr 镜像供 containers-smoke 端到端测试。
      - run: docker pull ${{ env.OPENCLAW_IMAGE }}
      # 端口映射探针（#378 CI 定位）：确认 runner 上容器宿主端口映射可用（docker-proxy）。
      # 若映射失效，pairingSmoke 容器内网关 ready 但宿主 127.0.0.1:<port> 恒 ECONNREFUSED——环境问题，
      # 先在此 step 暴露而非等 smoke 超时。
      - name: Docker port mapping probe
        run: |
          docker run -d --name port-probe -p 19899:18789 alpine:latest sh -c 'echo probe > /dev/tcp/0.0.0.0/18789 && sleep 60' || exit 1
          sleep 2
          for i in $(seq 1 10); do
            if (echo > /dev/tcp/127.0.0.1/19899) 2>/dev/null; then echo "PORT MAPPING OK"; docker rm -f port-probe >/dev/null 2>&1; exit 0; fi
            sleep 1
          done
          echo "PORT MAPPING FAILED (127.0.0.1:19899 unreachable)"; docker logs port-probe 2>&1 | tail -5; docker rm -f port-probe >/dev/null 2>&1; exit 1
      - run: npm test
      - run: npm run build

# GitHub Actions CI —— issue #91（skeleton + frontend job）、issue #92（backend-unit job）。
# 父票 #74。push 触发；frontend / backend-unit 双轨并行把关（vitest + vue-tsc / pytest），
# 任一红即拦。container-smoke 等真容器 job 由 #74 其余子票追加。
name: CI

on: push

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # 对齐 frontend/package-lock.json 的 LTS（约束 ^20.19.0||^22.12.0||>=24.0.0）
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test
      - run: npm run build

  backend-unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements/dev.txt
      - run: pip install -r requirements/dev.txt
      - run: python -m pytest

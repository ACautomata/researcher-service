name: PR Agent

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  issue_comment:

jobs:
  pr_agent:
    if: ${{ github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Run PR Agent with ZAI
        # the-pr-agent/pr-agent main，固定提交以避免上游 Action 静默变更。
        uses: the-pr-agent/pr-agent@e7fd5a233a4bf95d01a3c399e62768cb33172ec9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # ZAI 的 Anthropic 兼容协议端点；密钥只从 Actions Secret 注入。
          ANTHROPIC__KEY: ${{ secrets.ZAI_API_KEY }}
          ANTHROPIC_API_BASE: "https://open.bigmodel.cn/api/anthropic"
          config.model: "anthropic/glm-5.3"
          # 不配置其他厂商的 fallback，避免失败时产生意外调用和费用。
          config.fallback_models: '[]'
          # 自定义模型不在内置 token 表中，按 256K 输入窗口处理 PR 上下文。
          config.custom_model_max_tokens: "262144"
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "true"
          github_action_config.auto_improve: "true"

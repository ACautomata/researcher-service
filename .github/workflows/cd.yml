# GitHub Actions CD —— 打包前后端 Docker 镜像推 GHCR，经 SSH 部署到宝塔宿主。
#
# 触发：CI 在 master 上成功完成后（workflow_run），保证「不部署红码」。
# 镜像：server（TS/Express 控制面，替代退役的 Django backend，#341 M9）+ frontend（Vue/Vite→nginx）
# + wiki（wiki 容器镜像，#784：busybox 级，Dockerfile FROM 基线行单源提取版本 tag）
# 三镜像，tag `:latest` + `:<CI head_sha>`（head_sha 取自通过的 CI run，使 latest/sha 精确对应该
# commit，便于 :sha 回滚）。wiki 镜像另推**版本 tag**。
# server 镜像构建期经 buildx 多 context 注入 home 模板（researcher 克隆）
#（ADR 0013：#593 模板入镜像，生产不再挂载任何宿主数据路径）；server 容器
# 运行时经 config.ts OPENCLAW_IMAGE 默认值拉存量钉版 GHCR openclaw 镜像（openclaw-image 派生镜像
# 构建链已随 T0 #801 退役，存量镜像可继续拉取）。
# 部署：appleboy/scp-action 推 compose + 渲染 .env → /www/panel；appleboy/ssh-action 远端
# docker login（持久，供运行时 OpenClaw 拉取复用宿主 daemon 凭证）→ pull → up -d → prune → /api/health 健康门。
#
# 所需 secrets（见 deploy/DEPLOY.md 清单）：
#   REMOTE_HOST REMOTE_USER DEPLOY_KEY            —— SSH 登录宿主
#   GHCR_PULL_USER GHCR_PULL_TOKEN                —— 宿主拉私有 GHCR（read:packages PAT）
#   JWT_SECRET LLM_API_KEY CREDENTIAL_ENCRYPTION_KEYS —— server 运行时
#   RESEARCHER_REPO（可选，默认 https://github.com/ACautomata/researcher.git）—— 构建机 clone home 模板

name: CD

on:
  # #341 M9 恢复自动部署：后端迁 TS/Express 完成，CI 成功即自动部署 server + frontend 镜像。
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [master]

# 仅在 CI 成功时部署；失败/取消即跳过（job 级 if 守卫）。
concurrency:
  group: cd-master
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # GITHUB_TOKEN 推 ghcr.io（本 repo 所属 GHCR 无需额外 secret）
    env:
      REGISTRY: ghcr.io
      # CI run 的 head_sha：使镜像 tag 精确对应通过 CI 的 commit（而非 CD run 自身 sha）。
      IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
      # SERVER_IMAGE / FRONTEND_IMAGE 不进 job env：它们依赖归一小写后的 IMAGE_REPO，
      # 而 job env 在 job 启动时即求值（彼时 IMAGE_REPO 未设，会得空值）。故在下方
      # "Normalize image repo" step 里经 $GITHUB_ENV 一并写入，step 运行时才是正确值。
    steps:
      - uses: actions/checkout@v7
        with:
          # 构建须基于通过 CI 的那个 commit，而非 master 当前头（可能已前进）。
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Normalize image repo (lowercase)
        # github.repository 的 owner 可能含大写（本仓 ACautomata），而 Docker/GHCR reference
        # 要求 repository name 全小写——否则 buildx 校验报
        # "repository name must be lowercase"（本 bug：CI 全绿但 CD 必败）。
        # 表达式层无大小写转换函数（case 是 switch），故用 shell tr 归一后写入 $GITHUB_ENV。
        run: |
          IMAGE_REPO="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          echo "IMAGE_REPO=${IMAGE_REPO}" >> "$GITHUB_ENV"
          echo "SERVER_IMAGE=ghcr.io/${IMAGE_REPO}/server" >> "$GITHUB_ENV"
          echo "FRONTEND_IMAGE=ghcr.io/${IMAGE_REPO}/frontend" >> "$GITHUB_ENV"
          # wiki 容器镜像（#784）：server config.ts WIKI_IMAGE 默认值指向它的版本 tag（版本源
          # deploy/wiki-image/Dockerfile FROM 基线，wikiImage.test.ts 交叉断言锁死）
          echo "WIKI_IMAGE=ghcr.io/${IMAGE_REPO}/wiki" >> "$GITHUB_ENV"

      - name: Resolve wiki image version tag (Dockerfile FROM 单源, #784)
        # wiki 容器镜像的版本单源 = deploy/wiki-image/Dockerfile 的 FROM 基线行（对齐 openclaw
        # 派生镜像先例 issue #695）：config.ts WIKI_IMAGE 默认值与之同版本（wikiImage.test.ts
        # 交叉断言锁死），CD 一并推该版本 tag。提取失败即 fail：绝不推空 tag、sha 或含 '/' 的串。
        run: |
          FROM_REF="$(grep -m1 -E '^[[:space:]]*FROM[[:space:]]' deploy/wiki-image/Dockerfile | awk '{print $2}')"
          case "$FROM_REF" in
            *@*)
              echo "[cd] ERROR: wiki-image Dockerfile FROM 行为 digest 钉定，无法提取版本 tag: '${FROM_REF}'" >&2
              exit 1
              ;;
          esac
          VERSION_TAG="${FROM_REF##*:}"
          if [ -z "$FROM_REF" ] || [ -z "$VERSION_TAG" ] || [ "$VERSION_TAG" = "$FROM_REF" ]; then
            echo "[cd] ERROR: 无法从 wiki-image Dockerfile FROM 行提取版本 tag: '${FROM_REF}'" >&2
            exit 1
          fi
          case "$VERSION_TAG" in
            */*)
              echo "[cd] ERROR: 无法从 wiki-image Dockerfile FROM 行提取版本 tag（末段 ':' 疑为 registry 端口）: '${FROM_REF}'" >&2
              exit 1
              ;;
          esac
          echo "WIKI_VERSION_TAG=${VERSION_TAG}" >> "$GITHUB_ENV"
          echo "[cd] wiki 镜像版本 tag: ${VERSION_TAG}"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Log in to GHCR (push)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Clone researcher home template (build-time, ADR 0013)
        # issue #593：home 模板构建期 clone 并作为 buildx 多 context 注入 server 镜像
        # （Dockerfile COPY --from=template），不再 scp/挂载到宿主 /srv/openclaw/template。
        # 每次构建 clone 最新 → 模板随镜像 :sha 版本化（回滚镜像即回滚模板）；
        # clone 失败即构建失败 → CD 红（模板是构建必需，不带病出镜像）。
        # 清理 .git：COPY --from=template 整棵入镜像 + provision cp -a 会一并拷进容器
        # ~/.openclaw/.git（模板只作内容源，版本由镜像 :sha 记录，无需携带仓库元数据）。
        env:
          RESEARCHER_REPO: ${{ secrets.RESEARCHER_REPO }}
        run: |
          REPO="${RESEARCHER_REPO:-https://github.com/ACautomata/researcher.git}"
          git clone --depth 1 "$REPO" "${{ github.workspace }}/_templates/researcher"
          rm -rf "${{ github.workspace }}/_templates/researcher/.git"

      - name: Build & push server image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: server
          file: server/Dockerfile
          # 多 context（buildx named context，Dockerfile 以 COPY --from=<name> 消费）：
          #   template=researcher 克隆（home 模板，ADR 0013 入镜像）
          build-contexts: |
            template=${{ github.workspace }}/_templates/researcher
            official=${{ github.workspace }}/official
            plugins=${{ github.workspace }}/plugins
          push: true
          tags: |
            ${{ env.SERVER_IMAGE }}:latest
            ${{ env.SERVER_IMAGE }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server

      - name: Build & push frontend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Build & push wiki container image (#784)
        # wiki 容器镜像：busybox 级极简（sh/mkdir/rm/cat，无运行时）+ 零初始化（无骨架 COPY，
        # /wiki 属主由控制面创建流程预置）。构建期断言在 Dockerfile RUN 内（最小 applet 集），
        # 任一失败即构建失败 → CD 红。三个 tag：:latest + :<sha> + 版本 tag（版本从 FROM 基线行
        # 单源提取，见上方 Resolve step；版本 tag 一经发布不可移动）。
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: deploy/wiki-image
          file: deploy/wiki-image/Dockerfile
          push: true
          tags: |
            ${{ env.WIKI_IMAGE }}:latest
            ${{ env.WIKI_IMAGE }}:${{ env.IMAGE_TAG }}
            ${{ env.WIKI_IMAGE }}:${{ env.WIKI_VERSION_TAG }}
          cache-from: type=gha,scope=wiki-image
          cache-to: type=gha,mode=max,scope=wiki-image

      - name: Stage deploy artifacts (compose + rendered .env)
        # 运行时敏感值渲染为 .env（compose env_file 读取）；.env 不进 git，仅经 scp 落到宿主。
        # 两个文件先汇入扁平 staging 目录，scp 以 strip_components=1 整目录平铺到 /www/panel/ 根部，
        # 避免 source 多路径不同深度 + strip_components 的错位问题。
        run: |
          mkdir -p _deploy
          cp deploy/docker-compose.deploy.yml _deploy/
          # T0 #801：openclaw.json 模板与 openclaw-image 派生镜像构建链均已退役——CD 只分发
          # compose；home 模板经 build-contexts template= 构建期入 server 镜像（ADR 0013）。
          # 命名 .env：compose 变量替换（$PANEL_SERVER_IMAGE 等）与 env_file 都自动读它，
          # v1/v2 CLI 行为一致（--env-file 仅 v2 且只管 env_file 不管替换；v1 缺 .env 直接报错）。
          # #341 M9：DJANGO_SECRET_KEY → JWT_SECRET（server config.ts 生产必填 ≥32 字符）；
          # DJANGO_ALLOWED_HOSTS 删除（Express 不校验 Host）。
          {
            echo "JWT_SECRET=${{ secrets.JWT_SECRET }}"
            echo "LLM_API_KEY=${{ secrets.LLM_API_KEY }}"
            echo "CREDENTIAL_ENCRYPTION_KEYS=${{ secrets.CREDENTIAL_ENCRYPTION_KEYS }}"
            echo "PANEL_SERVER_IMAGE=${{ env.SERVER_IMAGE }}:latest"
            echo "PANEL_FRONTEND_IMAGE=${{ env.FRONTEND_IMAGE }}:latest"
          } > _deploy/.env
          chmod 600 _deploy/.env

      - name: Copy compose + .env to host
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345  # v1
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          source: "_deploy"
          target: "/www/panel/"
          strip_components: 1   # 去掉 _deploy/ 前缀，内容平铺到 /www/panel/ 根部
          overwrite: true

      - name: Deploy over SSH (login → pull → up → health gate)
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2  # v1
        env:
          GHCR_PULL_USER: ${{ secrets.GHCR_PULL_USER }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          envs: GHCR_PULL_USER,GHCR_PULL_TOKEN
          script: |
            set -euo pipefail

            APP_DIR=/www/panel
            # 防御性 bootstrap：缺则建（首次部署）；后续幂等。home 模板不再落宿主
            # （ADR 0013：#593 构建期入 server 镜像，见构建步骤 clone + build-contexts）。
            mkdir -p "$APP_DIR"

            # 持久登录 ghcr：deploy 拉面板镜像 + 运行时后端经宿主 daemon 拉 OpenClaw 镜像共用此凭证。
            echo "$GHCR_PULL_TOKEN" | docker login ghcr.io -u "$GHCR_PULL_USER" --password-stdin

            cd "$APP_DIR"
            # 显式指定 compose 文件：scp 落盘的是 docker-compose.deploy.yml（非默认名
            # compose.yml/docker-compose.yml），缺 -f 会让 pull/up 报
            # "no configuration file provided: not found"。
            docker compose -f docker-compose.deploy.yml pull
            # T0 #801：fleet 目标镜像 = config.ts 钉版存量 GHCR 引用（openclaw-image 派生镜像构建
            # 已退役）——镜像版本不再随发版变化，宿主预拉无意义；首次缺缓存时由 server 侧
            # dockerode 裸 pull（daemon 侧持久登录凭证）补齐。
            docker compose -f docker-compose.deploy.yml up -d --remove-orphans
            docker image prune -f

            # 健康门：frontend 反代 /api/health（公开探针），30s 内非 200 即 fail 让 workflow 红。
            # 保留真实 Host 头（researcher.acautomata.top）：nginx 反代会发 $host=该域名；
            # Express 不校验 Host（#341 M9 后无 ALLOWED_HOSTS），头保留无害、回滚兼容更好。
            echo "[deploy] waiting for /api/health ..."
            ok=0
            for i in $(seq 1 15); do
              if curl -fsS -H "Host: researcher.acautomata.top" http://127.0.0.1:18080/api/health >/dev/null 2>&1; then ok=1; break; fi
              sleep 2
            done
            if [ "$ok" != "1" ]; then
              echo "[deploy] ERROR: /api/health did not return 200 in time" >&2
              docker compose -f docker-compose.deploy.yml ps >&2 || true
              echo "[deploy] --- server logs (tail) ---" >&2
              docker compose -f docker-compose.deploy.yml logs --tail=50 server >&2 || true
              exit 1
            fi
            echo "[deploy] healthy ✓"
